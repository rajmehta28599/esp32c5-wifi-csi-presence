<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title id="t">How Wi-Fi CSI and mmWave radar see a person</title>
<desc id="d">Left: a Wi-Fi access point and an ESP32-C5 joined by one radio link drawn as an ellipse (Fresnel zone). A person walks across the link; while the person is inside the zone the link ripples and the CSI amplitude trace below wiggles, and outside the zone the trace is flat. Caption: Wi-Fi CSI: one link, sees that the channel changed, not where or who. Right: a MIMO mmWave radar (research grade) on a wall sends a fan-shaped beam divided into range bins; two people at different distances show as two separate dots with small chest-movement pulses. Caption: mmWave radar separates people by distance and angle. Consumer 60 GHz products give vitals for one person only; separating two chests is research-grade MIMO radar.</desc>
<defs>
  <clipPath id="traceClip"><rect x="40" y="305" width="360" height="60"/></clipPath>
  <clipPath id="fanClip"><path d="M528,215 L824.6,70.3 A330,330 0 0 1 824.6,359.7 Z"/></clipPath>
</defs>
