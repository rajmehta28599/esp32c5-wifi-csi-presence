<text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">How Wi-Fi CSI and mmWave radar see a person</text>
<line x1="480" y1="52" x2="480" y2="420" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>

