<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 960 448" width="960" height="448" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="t">Why the board got almost no CSI on the 11ax AP (2026-11-05)</title>
  <desc id="d">Two rows. Row 1, default (board advertises beamformee support): the AP sends a steered, beamformed frame to the ESP32-C5; the filter acquire_csi_beamformed = 0 drops it; about 0-2 CSI per 10 s. Row 2, board sets he_su / vht_su / vht_mu beamformee_disabled = 1: the AP sends a normal, unsteered frame; it passes the filter into the CSI bucket; about 453-483 CSI per 10 s. One 11ax AP, one session, 2026-11-05. Not yet a general rule. Frame steering is inferred from the config results, not logged.</desc>

  <!-- background -->
  <rect x="1" y="1" width="958" height="446" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>

  <text x="40" y="38" font-size="20" font-weight="700" fill="#0f172a">Why the board got almost no CSI on the 11ax AP (2026-11-05)</text>

  <!-- ============ ROW 1 ============ -->
  <rect x="24" y="56" width="912" height="172" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="24" y="66" width="5" height="18" rx="2" fill="#dc2626"/>
  <text x="40" y="80" font-size="15" font-weight="700" fill="#0f172a">Default (board advertises beamformee support)</text>

  <!-- AP -->
  <g>
    <line x1="58" y1="128" x2="52" y2="112" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="92" y1="128" x2="98" y2="112" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="40" y="128" width="70" height="44" rx="7" fill="#334155"/>
    <text x="75" y="155" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">AP</text>
    <text x="75" y="192" font-size="13" fill="#475569" text-anchor="middle">11ax AP</text>
  </g>

  <!-- narrow steered beam -->
  <polygon points="112,150 450,140 450,160" fill="#2563eb" opacity="0.18">
    <animate attributeName="opacity" values="0.14;0.28;0.14" dur="6s" repeatCount="indefinite"/>
  </polygon>
  <line x1="112" y1="150" x2="450" y2="150" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 5" opacity="0.6"/>
  <rect x="140" y="114" width="30" height="20" rx="4" fill="#d97706"/>
  <text x="155" y="129" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">BF</text>
  <text x="178" y="129" font-size="13" fill="#475569">steered (beamformed) frame</text>

  <!-- board -->
  <rect x="450" y="100" width="290" height="100" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="462" y="119" font-size="13" font-weight="700" fill="#0f172a">ESP32-C5</text>
  <rect x="498" y="126" width="12" height="66" rx="3" fill="#d97706"/>
  <text x="450" y="219" font-size="13" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">filter: acquire_csi_beamformed = 0</text>
  <!-- drop outcome (static, readable without animation) -->
  <text x="540" y="156" font-size="15" font-weight="700" fill="#dc2626">dropped</text>
  <g opacity="0.2" stroke="#dc2626" stroke-width="3" stroke-linecap="round">
    <line x1="466" y1="140" x2="486" y2="160"/>
    <line x1="486" y1="140" x2="466" y2="160"/>
  </g>

  <!-- counter -->
  <rect x="766" y="116" width="160" height="68" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="846" y="146" font-size="19" font-weight="700" fill="#dc2626" text-anchor="middle">&#8776;0-2 CSI</text>
  <text x="846" y="170" font-size="14" fill="#0f172a" text-anchor="middle">per 10 s</text>

  <!-- travelling beamformed frame -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="6s" repeatCount="indefinite"
      values="128 150;128 150;476 150;476 150;476 164;476 164"
      keyTimes="0;0.0667;0.4333;0.7333;0.8333;1"/>
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite"
      values="0;1;1;1;0;0" keyTimes="0;0.0667;0.4333;0.7333;0.8333;1"/>
    <rect x="-17" y="-11" width="34" height="22" rx="4" fill="#2563eb">
      <animate attributeName="fill" dur="6s" repeatCount="indefinite"
        values="#2563eb;#2563eb;#2563eb;#94a3b8;#94a3b8;#2563eb"
        keyTimes="0;0.0667;0.4333;0.4833;0.9;1"/>
    </rect>
    <text x="0" y="5" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">BF</text>
  </g>
  <!-- animated red X -->
  <g stroke="#dc2626" stroke-width="4" stroke-linecap="round" opacity="0">
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite"
      values="0;0;1;1;0;0" keyTimes="0;0.4333;0.4833;0.7333;0.8333;1"/>
    <line x1="464" y1="138" x2="488" y2="162"/>
    <line x1="488" y1="138" x2="464" y2="162"/>
  </g>

  <!-- ============ ROW 2 ============ -->
  <rect x="24" y="238" width="912" height="172" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="24" y="248" width="5" height="18" rx="2" fill="#16a34a"/>
  <text x="40" y="262" font-size="15" font-weight="700" fill="#0f172a">Board sets he_su / vht_su / vht_mu beamformee_disabled = 1</text>

  <!-- AP -->
  <g>
    <line x1="58" y1="308" x2="52" y2="292" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="92" y1="308" x2="98" y2="292" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="40" y="308" width="70" height="44" rx="7" fill="#334155"/>
    <text x="75" y="335" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">AP</text>
    <text x="75" y="372" font-size="13" fill="#475569" text-anchor="middle">11ax AP</text>
  </g>

  <!-- wide unsteered beam -->
  <polygon points="112,330 450,286 450,374" fill="#0d9488" opacity="0.12">
    <animate attributeName="opacity" values="0.10;0.20;0.10" dur="6s" repeatCount="indefinite"/>
  </polygon>
  <text x="200" y="300" font-size="13" fill="#475569">normal (unsteered) frame</text>

  <!-- board -->
  <rect x="450" y="280" width="290" height="100" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="462" y="299" font-size="13" font-weight="700" fill="#0f172a">ESP32-C5</text>
  <rect x="498" y="306" width="12" height="66" rx="3" fill="#d97706"/>
  <text x="450" y="399" font-size="13" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">filter: acquire_csi_beamformed = 0</text>
  <!-- static faint tick -->
  <polyline points="522,358 530,366 544,348" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.25"/>
  <!-- CSI bucket -->
  <path d="M622 316 L708 316 L698 372 L632 372 Z" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <path d="M622 316 L708 316 L698 372 L632 372 Z" fill="#0d9488" opacity="0">
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite"
      values="0;0;0.35;0;0" keyTimes="0;0.6667;0.7667;0.9;1"/>
  </path>
  <text x="665" y="366" font-size="15" font-weight="700" fill="#0f766e" text-anchor="middle">CSI</text>

  <!-- counter -->
  <rect x="766" y="296" width="160" height="68" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5">
    <animate attributeName="stroke-width" dur="6s" repeatCount="indefinite"
      values="1.5;1.5;3.5;1.5;1.5" keyTimes="0;0.6667;0.7667;0.9;1"/>
  </rect>
  <text x="846" y="326" font-size="19" font-weight="700" fill="#15803d" text-anchor="middle">&#8776;450-485 CSI</text>
  <text x="846" y="350" font-size="14" fill="#0f172a" text-anchor="middle">per 10 s</text>

  <!-- travelling normal frame -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="6s" repeatCount="indefinite"
      values="128 330;128 330;476 330;532 330;665 330;665 346;665 346"
      keyTimes="0;0.0667;0.4333;0.4833;0.6667;0.7667;1"/>
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite"
      values="0;1;1;0;0" keyTimes="0;0.0667;0.6667;0.7667;1"/>
    <rect x="-17" y="-11" width="34" height="22" rx="4" fill="#0d9488"/>
    <line x1="-10" y1="-3" x2="10" y2="-3" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="-10" y1="4" x2="6" y2="4" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- animated green tick -->
  <polyline points="522,358 530,366 544,348" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0">
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite"
      values="0;0;1;1;0;0" keyTimes="0;0.45;0.5;0.7333;0.8333;1"/>
  </polyline>

  <!-- footnote -->
  <text x="40" y="434" font-size="13" fill="#475569">One 11ax AP, one session, 2026-11-05. Not yet a general rule. Frame steering is inferred from the config results, not logged.</text>
</svg>
