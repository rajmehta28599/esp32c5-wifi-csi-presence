<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="960" height="472" viewBox="0 0 960 472" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title id="t">Counting: one link vs several links</title>
<desc id="d">Two rooms, each with the same three people walking. Left, 1 link: one access point and one ESP32 node joined by a single line; only the person who crosses that line makes it flash, so the people count it gives keeps changing. Right, 4 links: four links cross the room; each person lights the links they cross, so the count is steadier. Footer: Wi-CaL (4 ESP32 TX/RX links, about 5-10 people, trained per room): median error 0.55-0.82 with 1 link vs 0.35-0.41 with 4. Illustration only: the counts shown are not data.</desc>
<style>text{fill:#0f172a}.s{fill:#64748b}</style>
<defs><g id="ap"><rect x="-17" y="-11" width="34" height="22" rx="5" fill="#1e3a8a"/><text x="0" y="5" text-anchor="middle" font-size="13" font-weight="700" style="fill:#ffffff">AP</text></g><g id="node"><rect x="-9" y="-9" width="18" height="18" rx="3" fill="#0f766e" stroke="#ffffff" stroke-width="2"/><circle cx="0" cy="0" r="3" fill="#ffffff"/></g><g id="person"><circle cx="0" cy="-8" r="5.5"/><path d="M-8.5,9 A8.5,8.5 0 0 1 8.5,9 Z" transform="translate(0,-2)"/></g></defs>
<rect x="1" y="1" width="958" height="470" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
